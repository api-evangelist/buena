name: Buena
description: 'Buena (Buena GmbH) is a Berlin-based modern property management company
  serving real estate owners across Germany, managing over 70,000 units. It provides
  WEG (condominium / Wohnungseigentümergemeinschaft) management, rental property management
  (Mietverwaltung), and property-management succession (Nachfolge) for owners seeking
  an alternative to conventional, reactive administrators. Buena positions itself as
  a technology-forward, proactive Hausverwaltung. It was surfaced as a portfolio company
  of EQT Ventures and GV and added to the API Evangelist network. As of this enrichment
  pass Buena publishes no public API, developer portal, SDK, or technical documentation
  — this profile captures verified company identity and public web properties only.'
